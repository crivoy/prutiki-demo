<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Квартира-коллекция</title>
<link href="../fonts/c93efdd5.css" rel="stylesheet">
<style>
  :root { --ink: #f3ece2; --dim: #b9b1a6; --glass: rgba(14, 16, 22, 0.55); --line: rgba(255, 240, 220, 0.16); --warm: #ffcf8a; --ghost: #8fc4ff; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070b; color: var(--ink); font: 15px/1.3 "Golos Text", -apple-system, "Segoe UI", sans-serif; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { display: block; touch-action: none; }
  .ui { position: fixed; z-index: 5; }
  #cap { top: max(14px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9); padding: 0 64px; }
  #cap b { display: block; font-weight: 600; font-size: 19px; letter-spacing: 0.01em; }
  #cap span { display: block; margin-top: 3px; color: var(--dim); font-size: 13.5px; min-height: 18px; }
  #nav { left: 16px; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 14px; pointer-events: none; }   /* точки — всегда по центру, кнопки — по бокам от них */
  #prev { justify-self: end; pointer-events: auto; } #next { justify-self: start; pointer-events: auto; }
  #nav button { min-width: 48px; height: 48px; border-radius: 24px; display: flex; align-items: center; gap: 8px; padding: 0 14px 0 12px !important; white-space: nowrap; border: 1px solid var(--line); background: var(--glass); color: var(--ink); font: 400 30px/1 Georgia, serif; padding: 0 0 4px; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #nav button b { font: 400 30px/1 Georgia, serif; margin-top: -4px; } #nav button em { font: 500 13.5px/1.2 "Golos Text", sans-serif; font-style: normal; color: var(--dim); } #next { padding: 0 12px 0 14px !important; }
  #put { left: 50%; translate: -50% 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); border: 1px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 22px; padding: 10px 20px; font: 500 15px/1 "Golos Text", sans-serif; cursor: pointer; z-index: 6; }
  #nav button:active { transform: scale(0.94); }
  body.holding #put:has(~ #carry:not([style*="none"])) { translate: calc(-100% - 8px) 0; } #carry { left: 50%; translate: 8px 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); z-index: 6; }   /* «переставить» рядом с «на место» (выбор пользователя 23.10: «взять с собой») */
  #carried { left: 50%; translate: -50% 0; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); z-index: 6; padding: 0 14px 0 6px !important; } #carried img { width: 38px; height: 38px; object-fit: contain; } #carried b { margin-left: 6px; opacity: .85; }   /* фигурка «с собой»: тап — вернуть на место */
  body.carrying #toast { bottom: auto; top: calc(max(14px, env(safe-area-inset-top)) + 54px); }
  #dots { display: flex; gap: 6px; }
  #dots i { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 240, 220, 0.25); }
  #dots i.on { background: var(--warm); }
  #demo { top: max(14px, env(safe-area-inset-top)); right: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 10px; padding: 8px 11px; font: 500 13px/1.2 "Golos Text", sans-serif; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); max-width: 128px; }
  #toast { left: 50%; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 64px); transform: translateX(-50%); max-width: min(440px, calc(100vw - 32px)); text-align: center; padding: 9px 14px; border-radius: 10px; background: rgba(10, 12, 18, 0.72); border: 1px solid var(--line); font-size: 14px; opacity: 0; transition: opacity 0.35s; pointer-events: none; }
  #toast.on { opacity: 1; }
  body.holding #toast { bottom: auto; top: calc(max(14px, env(safe-area-inset-top)) + 54px); }
  #toast em { font-style: normal; color: var(--warm); }
  #stat { bottom: max(14px, env(safe-area-inset-bottom)); left: 12px; font: 11px/1.3 ui-monospace, Menlo, monospace; color: rgba(255, 240, 220, 0.45); pointer-events: none; white-space: pre; }
  #load { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; background: #05070b; color: var(--dim); font-size: 14px; transition: opacity 0.6s; }
  #err { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; padding: 16px; color: #ffb3b3; white-space: pre-wrap; background: rgba(0, 0, 0, 0.85); font: 12px/1.4 ui-monospace, monospace; }
  #err { flex-direction: column; gap: 22px; } #err > div { font: 800 22px/1.4 "M PLUS Rounded 1c", sans-serif; color: #f3ece2; text-align: center; white-space: normal; }   /* игроку — понятный текст и кнопка (Яндекс 1.14, 1.15); стек — только с ?dev */
  #back { top: max(14px, env(safe-area-inset-top)); left: 12px; border: 1px solid var(--line); background: var(--glass); color: var(--ink); border-radius: 10px; padding: 8px 12px; font: 500 14px/1.2 "Golos Text", sans-serif; cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #tags { inset: 0; pointer-events: none; z-index: 4; }
  #tags i { position: absolute; left: 0; top: 0; font: 600 11.5px/1 "Golos Text", sans-serif; font-style: normal; color: var(--ink); background: rgba(10, 12, 18, 0.62); border: 1px solid var(--line); padding: 3px 7px; border-radius: 9px; white-space: nowrap; }

  /* кнопки — аркадные купола, как в меню и у автомата (выбор пользователя 23.10, ui.js сборки .ab); в квартире — оранжевые */
  .ab, #nav button, #demo, #back, #put, #carry, #carried { --c: #ff9a3d; --l: #ffd2a3; --d: #9a4a08; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 0 18px; border-radius: 999px; border: 3px solid #22232b; color: #fff; font: 800 15px/1 "M PLUS Rounded 1c", sans-serif; text-shadow: 0 1px 2px #0009; cursor: pointer; white-space: nowrap;
    background: radial-gradient(120% 90% at 50% 18%, var(--l) 0, var(--c) 45%, var(--d) 100%); box-shadow: 0 0 0 3px #c9cdd6, 0 0 0 4px #5d616c, 0 6px 0 4px #34363e, 0 12px 18px 4px #000a, inset 0 3px 4px #fff9, inset 0 -5px 8px #0005; transition: transform .08s, box-shadow .08s; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .ab:active, #nav button:active, #demo:active, #back:active, #put:active { transform: translateY(5px); box-shadow: 0 0 0 3px #c9cdd6, 0 0 0 4px #5d616c, 0 1px 0 4px #34363e, 0 4px 8px 4px #000a, inset 0 3px 4px #fff9, inset 0 -3px 6px #0005; }
  #nav button { padding: 0 18px !important; min-width: 0; }
  #nav button { width: 220px; justify-content: space-between; } #nav button em { flex: 1; min-width: 0; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }   /* одна ширина у ‹ › — не прыгают от длины подписи (пользователь 23.10) */
  @media (max-width: 600px) { #nav button { width: calc(50vw - 24px); } }
  #nav button b { font: 800 22px/1 "M PLUS Rounded 1c", sans-serif; margin-top: -2px; } #nav button em { font: 800 14px/1.1 "M PLUS Rounded 1c", sans-serif; font-style: normal; color: #fff; }
  #cap b { font: 800 30px/1.1 "M PLUS Rounded 1c", sans-serif; text-shadow: 0 3px 0 #9a4a08, 0 8px 16px #000a; }
  #cap span { font: 500 14px/1.3 "M PLUS Rounded 1c", sans-serif; color: #ffe3f0; text-shadow: 0 1px 3px #000; }
  #demo, #back { top: max(14px, env(safe-area-inset-top)); }
  body.embed #demo { left: 16px; right: auto; width: 46px; height: 46px; padding: 0; font-size: 24px; }   /* в игре: «‹ В зал» — круглая слева, как на стенде меню */
  body.embed.focus #demo { display: none; }   /* крупный план: слева «‹ назад» */
  #back { left: 16px; }
  @media (max-width: 600px) { #cap { padding: 0 146px 0 12px; text-align: left; } body.embed #cap { padding: 0 16px 0 78px; } #cap b { font-size: 24px !important; } body.focus #cap { padding-left: 140px; } #tags i { font-size: 10.5px; padding: 2px 5px; } #cap b { font-size: 17px; } #dots { display: none; } #nav { gap: 8px; } #nav button em { font-size: 12px; max-width: 34vw; overflow: hidden; text-overflow: ellipsis; } #stat { display: none; } }
  /* подсказка на месте (как на стенде E, style_lab/index.html #cue): кольцо, рука жестом (тап / свайп), подпись у конца жеста */
  body.pz #nav, body.pz #back, body.pz #demo, body.pz #boxes, body.pz #carry { visibility: hidden !important; }   /* первый проход распаковки: только нужная кнопка (пользователь 25.10) */
  #cue { position: fixed; left: 0; top: 0; z-index: 7; pointer-events: none; visibility: hidden; }
  #cue i { position: absolute; left: -30px; top: -30px; width: 60px; height: 60px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(255, 154, 61, .6), 0 0 18px rgba(255, 190, 120, .85); animation: cr 1.3s ease-out infinite; }
  #cue i + i { animation-delay: .65s; }
  @keyframes cr { from { transform: scale(.45); opacity: 1; } to { transform: scale(1.35); opacity: 0; } }
  #cue svg { position: absolute; left: 0; top: 0; width: 48px; height: 48px; overflow: visible; filter: drop-shadow(0 3px 4px rgba(20, 6, 14, .45)); }
  #cue b { position: absolute; left: 0; top: 0; transform: translateX(-50%); white-space: nowrap; font: 800 16px/1.2 "M PLUS Rounded 1c", sans-serif; color: #fff; text-shadow: 0 1px 2px #000; padding: 7px 13px; border-radius: 12px; background: rgba(10, 12, 18, 0.72); border: 1px solid rgba(255, 240, 220, 0.16); }
  #cue b:empty { display: none; }
  /* к неоткрытым коробкам (пользователь 23.10: «как заход в квартиру в зале — горит, что есть коробки»): значок коробки, красное число, мерцает */
  #boxes { --c: #ff9a3d; --l: #ffd2a3; --d: #9a4a08; top: max(14px, env(safe-area-inset-top)); right: 16px; width: 46px; height: 46px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; border: 3px solid #22232b; cursor: pointer;
    background: radial-gradient(120% 90% at 50% 18%, var(--l) 0, var(--c) 45%, var(--d) 100%); box-shadow: 0 0 0 3px #c9cdd6, 0 0 0 4px #5d616c, 0 6px 0 4px #34363e, 0 12px 18px 4px #000a, inset 0 3px 4px #fff9, inset 0 -5px 8px #0005; animation: bx 1.6s ease-in-out infinite; }
  body:not(.embed) #boxes { top: calc(max(14px, env(safe-area-inset-top)) + 70px); }   /* стенд: справа сверху — «демо» */
  #boxes:active { transform: translateY(5px); }
  #boxes i { position: absolute; top: -10px; right: -10px; min-width: 24px; height: 24px; padding: 0 6px; box-sizing: border-box; border-radius: 12px; background: #ff3b30; color: #fff; font: 800 14px/24px "M PLUS Rounded 1c", sans-serif; font-style: normal; text-align: center; box-shadow: 0 2px 4px #0008; }   /* как .badge у «Коллекции» в зале */
  @keyframes bx { 50% { filter: brightness(1.25) drop-shadow(0 0 10px rgba(255, 190, 120, .9)); } }
</style>
<script type="importmap">
{ "imports": { "three": "../vendor/three@0.170.0/build/three.module.js", "three/addons/": "../vendor/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="cap" class="ui"><b id="title">&nbsp;</b><span id="sub"></span></div>
<div id="stat" class="ui"></div>
<button id="back" class="ui" style="display:none">‹ назад</button>
<div id="tags" class="ui"></div>
<button id="demo" class="ui">демо: распаковка</button>
<button id="boxes" class="ui" style="display:none"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg><i></i></button>
<div id="toast" class="ui"></div>
<div id="cue"><i></i><i></i><svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><g stroke="#3a1f33" stroke-width="4.2"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g><g stroke="#fff" stroke-width="2"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g></svg><b></b></div>
<div id="nav" class="ui"><button id="prev" aria-label="Назад"><b>‹</b><em id="pn"></em></button><div id="dots"></div><button id="next" aria-label="Дальше"><em id="nn"></em><b>›</b></button></div>
<button id="put" class="ui" style="display:none">на место</button>
<button id="carry" class="ui" style="display:none">переставить</button>
<button id="carried" class="ui" style="display:none"></button>
<div id="load">Квартира загружается…</div>
<div id="err"></div>
<script type="module" src="apt.js"></script>
</body>
</html>
